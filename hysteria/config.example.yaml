listen: :443

tls:
  cert: /etc/letsencrypt/live/vpn-parallel-domains/fullchain.pem
  key: /etc/letsencrypt/live/vpn-parallel-domains/privkey.pem

auth:
  type: password
  password: "__AUTH_PASSWORD__"

obfs:
  type: salamander
  salamander:
    password: "__OBFS_PASSWORD__"

masquerade:
  type: proxy
  proxy:
    url: http://127.0.0.1
    rewriteHost: true

quic:
  initStreamReceiveWindow: 8388608
  maxStreamReceiveWindow: 8388608
  initConnReceiveWindow: 20971520
  maxConnReceiveWindow: 20971520

bandwidth:
  up: 200 mbps
  down: 500 mbps

ignoreClientBandwidth: false
disableUDP: false
udpIdleTimeout: 60s

# Every stream goes to Xray's loopback SOCKS inbound (through the stable relay
# vpn-socks-relay, which follows the blue/green colour), so server-side routing
# stays identical to the VLESS entry: Google -> FR/FI, .ru -> Moscow, rest -> EE.
outbounds:
  - name: xray
    type: socks5
    socks5:
      addr: 127.0.0.1:10809
      udp: true
