server {
    listen 85.92.158.238:2087 ssl;
    server_name share.esmien.com;

    ssl_certificate /etc/letsencrypt/live/share-esmien-com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/share-esmien-com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/vpn-2087.log vpnx;

    # Прикрытие: страница входа LiteLLM отдаётся из изолированной копии статики
    # (127.0.0.1:8092). В рабочий LiteLLM (:4000) отсюда не уходит ни один запрос,
    # а любой вход отбивается тем же 401, что отдаёт настоящая панель.
    location = / { return 302 /ui/; }
    location ^~ /ui/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location ^~ /litellm-asset-prefix/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location = /favicon.ico { proxy_pass http://127.0.0.1:8092; }
    location = /login { proxy_pass http://127.0.0.1:8092; }
    location ^~ /sso/ { proxy_pass http://127.0.0.1:8092; }
    location /general {
        proxy_pass http://127.0.0.1:11082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ~ ^/sub/(?<esmien_sub_token>[A-Za-z0-9_-]+)/?$ {
        root /var/www/esmien-sub;
        try_files /$esmien_sub_token/$esmien_sub_file =404;
        default_type text/plain;
        add_header Cache-Control "no-store";
        add_header profile-title $esmien_sub_title;
        add_header profile-update-interval 12;
        add_header announce $esmien_sub_announce;
        add_header Content-Disposition "inline; filename=$esmien_sub_fname";
    }
    location ~ ^/u/(?<esmien_page_token>[A-Za-z0-9_-]+)/?$ {
        root /var/www/esmien-pages;
        try_files /$esmien_page_token.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }
    location / { return 404; }
}
