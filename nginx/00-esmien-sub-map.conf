# Which artifact /sub/<token> serves is chosen by the client's User-Agent.
# Lives at http level (conf.d) because the VPN vhosts reference the variable.
map $http_user_agent $esmien_sub_file {
    default                        "list.txt";
    ~*(clash|mihomo|stash|flclash) "clash.yaml";
    ~*(singbox|sing-box)           "singbox.json";
}
