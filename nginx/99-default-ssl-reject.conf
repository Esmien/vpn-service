# Незаматченный SNI (проба «по голому IP», сканер без домена) не должен ни отдавать
# наш сертификат, ни показывать Open WebUI. ssl_reject_handshake обрывает рукопожатие
# до выдачи сертификата: снаружи это выглядит как «тут ничего нет».
#
# Важно: default_server перехватывает только те SNI, под которые нет server_name.
# Все наши домены по-прежнему попадают в свои vhost'ы. Откат — удалить этот файл
# (см. scripts/rollback-443-hardening.sh).
server {
    listen 127.0.0.1:9443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;
}
