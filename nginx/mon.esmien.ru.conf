# mon.esmien.ru -> beszel hub (127.0.0.1:8090), HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mon.esmien.ru;

    # Скрытая панель: наружу не отвечаем, только из туннеля (edge) и с хоста.
    allow 85.92.158.238;
    allow 127.0.0.1;
    deny all;
    error_page 403 = @drop80;
    location @drop80 { return 444; }

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:9443 proxy_protocol ssl http2;
    listen [::1]:9443 proxy_protocol ssl http2;
    server_name mon.esmien.ru;

    # Скрытая панель: наружу не отвечаем, только из туннеля (edge) и с хоста.
    allow 85.92.158.238;
    allow 127.0.0.1;
    deny all;
    error_page 403 = @drop;
    location @drop { return 444; }

    ssl_certificate /etc/letsencrypt/live/esmien-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esmien-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 20M;

    # VLESS over WebSocket (TLS терминируется здесь)
    location /ws {
        proxy_pass http://127.0.0.1:10081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
