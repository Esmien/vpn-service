server {
    listen 127.0.0.1:18443 ssl proxy_protocol;
    server_name vpn.esmien.ru;

    ssl_certificate     /etc/letsencrypt/live/esmien-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esmien-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    absolute_redirect off;
    port_in_redirect off;
    access_log /var/log/nginx/vpn-443.log;
    error_log  /var/log/nginx/vpn-443.err;

    # Тот же нейтральный сайт, что и на основном HTTPS-входе.
    # Прикрытие: вместо заглушки «Welcome» — страница входа LiteLLM (без бренда).
    location = / { return 302 /ui/; }
    location ^~ /ui/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location ^~ /litellm-asset-prefix/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location = /favicon.ico { proxy_pass http://127.0.0.1:4000; }

    location /general {
        proxy_pass http://127.0.0.1:10082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /assets/xdZb8xOKWJMLO5fEoTFvHqh- {
        proxy_pass http://127.0.0.1:10082/general;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / { return 404; }
}

