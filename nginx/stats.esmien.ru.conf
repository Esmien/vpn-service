# stats.esmien.ru -> статика /var/www/vpn-stats (per-user статистика xray)
server {
    listen 80;
    server_name stats.esmien.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:9443 proxy_protocol ssl http2;
    server_name stats.esmien.ru;
    ssl_certificate /etc/letsencrypt/live/esmien-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esmien-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/vpn-stats;
    index index.html;

    auth_basic "Esmien VPN stats";
    auth_basic_user_file /etc/nginx/vpn-stats.htpasswd;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api/ {
        proxy_pass http://127.0.0.1:9198/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /data.json {
        add_header Cache-Control "no-store" always;
        try_files /data.json =404;
    }

    location / { try_files $uri $uri/ index.html =404; }
}
