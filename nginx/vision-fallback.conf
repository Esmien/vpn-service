# Что видит посторонний, если пришёл на vpn.esmien.ru:443 с браузером:
# TLS терминирует Xray (vision-in), а всё, что не VLESS, уходит сюда простым HTTP.
# Отдаём ту же страницу входа LiteLLM, что и на основном HTTPS-входе — вместо заглушки.
server {
    listen 127.0.0.1:8091;
    server_name _;

    absolute_redirect off;
    access_log off;

    location = / { return 302 /ui/; }

    location ^~ /ui/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location ^~ /litellm-asset-prefix/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location = /favicon.ico { proxy_pass http://127.0.0.1:4000; }

    # Любой незнакомый путь тоже отдаёт страницу входа: и браузер, и проба
    # hysteria-авторизации видят обычный сайт, а не 404 от голого сервера.
    location / {
        proxy_pass http://127.0.0.1:4000/ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
