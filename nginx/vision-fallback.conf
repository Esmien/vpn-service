# Что видит посторонний, если пришёл на VPN-вход с браузером:
# TLS терминирует Xray (vision-in), всё, что не VLESS, уходит сюда простым HTTP.
# Отдаём ту же страницу входа LiteLLM, что и на основном HTTPS-входе — но из
# изолированной копии статики (127.0.0.1:8092). В рабочий LiteLLM (:4000) отсюда
# не уходит ни один запрос; любой вход отбивается 401 настоящей панели.
server {
    listen 127.0.0.1:8091;
    server_name _;

    absolute_redirect off;
    access_log off;

    location = / { return 302 /ui/; }

    location ^~ /ui/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location ^~ /litellm-asset-prefix/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location = /favicon.ico { proxy_pass http://127.0.0.1:8092; }
    location = /login { proxy_pass http://127.0.0.1:8092; }
    location ^~ /sso/ { proxy_pass http://127.0.0.1:8092; }

    # Любой незнакомый путь тоже отдаёт отказ авторизации: и браузер, и проба
    # hysteria-авторизации видят обычную панель, а не 404 от голого сервера.
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
