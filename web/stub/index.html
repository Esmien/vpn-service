<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Welcome</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, sans-serif; background: #f5f6f7; color: #20252b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 640px); padding: clamp(28px, 7vw, 60px); background: #fff; border: 1px solid #e5e8eb; border-radius: 18px; }
    .label { margin: 0 0 22px; color: #637182; font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3rem); font-weight: 600; letter-spacing: -.045em; }
    p { margin: 14px 0 0; color: #637182; line-height: 1.6; }
    @media (prefers-color-scheme: dark) { :root { background: #15191e; color: #f0f3f5; } main { background: #1d232a; border-color: #303941; } .label, p { color: #a5b0bb; } }
  </style>
</head>
<body>
  <main>
    <div class="label">Welcome</div>
    <h1>Welcome.</h1>
    <p>This page is online and available.</p>
  </main>
</body>
</html>
