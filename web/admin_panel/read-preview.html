<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esmien VPN — ПРОТОТИП админки (тестовые данные)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 56px;
    background: #0f1115; color: #e6e8ee;
    font: 14.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
    overflow-x: hidden;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  .proto-banner {
    margin: 0 0 18px; padding: 9px 13px; border-radius: 8px;
    background: #1f2433; border: 1px solid #384664; color: #9fc1ff;
    font-size: 12.5px; display: flex; justify-content: space-between; align-items: center;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .meta { color: #8b93a7; font-size: 13px; margin-bottom: 18px; }
  .meta b { color: #b9c0d0; font-weight: 500; }
  h2 {
    font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em;
    color: #8b93a7; font-weight: 600; margin: 26px 0 10px;
  }
  .notice {
    margin: 0 0 14px; padding: 10px 12px; border-radius: 8px;
    background: #1b2e23; border: 1px solid #2e543d; color: #7ce6b0; font-size: 13px;
    display: none;
  }

  /* Форма добавления подписки */
  .sub-add {
    display: grid; grid-template-columns: 1.1fr 1.8fr 1.1fr auto; gap: 8px;
    margin-bottom: 14px;
  }
  @media (max-width: 640px) {
    .sub-add { grid-template-columns: 1fr; }
  }
  input.inp {
    min-width: 0; padding: 8px 11px; border-radius: 8px;
    border: 1px solid #262d3a; background: #151922; color: #e6e8ee; font: inherit;
  }
  input.inp:focus { outline: none; border-color: #3f5270; }
  .btn {
    padding: 7px 12px; border-radius: 8px; border: 1px solid #2c3546;
    background: #1c2230; color: #cfd6e6; font: inherit; font-size: 13px;
    cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: #232b3b; }
  .btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 7px; }
  .btn-danger { color: #ff9b9b; border-color: #4a2b2f; background: transparent; }
  .btn-danger:hover { background: #2a1a1d; }
  .btn-primary { border-color: #36507a; background: #1c2940; color: #b8d4ff; }
  .btn-primary:hover { background: #233452; }

  /* Карточка сторонней подписки */
  .sub-card {
    border: 1px solid #242b38; border-radius: 10px; background: #131720;
    margin-bottom: 10px; overflow: hidden;
  }
  .sub-head {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    padding: 11px 14px; justify-content: space-between;
  }
  .sub-title-wrap {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; flex: 1;
  }
  .sub-toggle {
    cursor: pointer; font-weight: 600; color: #e6e8ee; user-select: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .sub-toggle::before { content: "▸"; color: #77809a; font-size: 12px; }
  .sub-card.open .sub-toggle::before { content: "▾"; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 500;
  }
  .badge.ok { background: #162a21; color: #6ee7a8; border: 1px solid #244736; }
  .badge.err { background: #2f1a1d; color: #ff9b9b; border: 1px solid #4f292e; }
  .exp-green { color: #6ee7a8; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .exp-orange { color: #f0b95c; font-size: 12.5px; font-variant-numeric: tabular-nums; font-weight: 500; }
  .exp-red { color: #ff7b7b; font-size: 12.5px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .exp-gray { color: #6c7486; font-size: 12.5px; }
  a.tg-link {
    color: #8fb7ff; text-decoration: none; font-size: 12.5px;
    padding: 2px 7px; border-radius: 6px; background: #182030; border: 1px solid #283650;
  }
  a.tg-link:hover { background: #202b40; }
  .sub-actions { display: flex; align-items: center; gap: 6px; }

  /* Спойлер текста заглушки провайдера (25-30 символов -> полный текст) */
  details.err-spoiler {
    display: inline-block; font-size: 12px; color: #ffb4b4;
    background: #25171a; border: 1px solid #44262b; border-radius: 6px; padding: 2px 8px;
  }
  details.err-spoiler > summary {
    cursor: pointer; list-style: none; user-select: none;
  }
  details.err-spoiler > summary::-webkit-details-marker { display: none; }
  details.err-spoiler > summary::after { content: " ▾"; color: #ff8080; }
  details.err-spoiler[open] > summary::after { content: " ▴"; }
  .err-full {
    margin-top: 6px; padding-top: 6px; border-top: 1px dashed #44262b;
    white-space: pre-line; color: #ffd4d4; font-size: 12px;
  }

  /* Внутри карточки подписки: калибровка пулов */
  .sub-body {
    display: none; padding: 12px 14px 14px; border-top: 1px solid #1e2430; background: #0f1219;
  }
  .sub-card.open .sub-body { display: block; }
  .sub-url-bar {
    display: flex; gap: 8px; align-items: center; margin-bottom: 12px;
  }
  .sub-url-bar span { font-size: 12px; color: #8b93a7; white-space: nowrap; }

  details.pool-box {
    border: 1px solid #212836; border-radius: 8px; background: #131720;
    margin-bottom: 8px; padding: 8px 11px;
  }
  details.pool-box > summary {
    cursor: pointer; list-style: none; display: flex; align-items: center;
    justify-content: space-between; font-weight: 500; font-size: 13.5px;
  }
  details.pool-box > summary::-webkit-details-marker { display: none; }
  .pool-title::before { content: "+ "; color: #77809a; font-weight: 700; }
  details.pool-box[open] .pool-title::before { content: "− "; }
  .pool-meta { font-size: 12px; color: #8b93a7; font-weight: 400; margin-left: 6px; }

  .node-list { margin-top: 8px; }
  .node-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 7px 0; border-top: 1px solid #1d2330; font-size: 13px;
  }
  .node-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .st-ok { color: #6ee7a8; font-weight: 700; width: 14px; text-align: center; }
  .st-bad { color: #ff8080; font-weight: 700; width: 14px; text-align: center; }
  .st-un { color: #5a6274; width: 14px; text-align: center; }
  .name-pair { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .name-orig { color: #8b93a7; }
  .name-sep { color: #4d566a; margin: 0 4px; }
  .name-custom { color: #e6e8ee; font-weight: 500; }
  .probe-info { font-size: 11.5px; color: #7d869c; white-space: nowrap; }

  /* Блок Б: Управление маршрутами (Основной, Gemini, RU) */
  details.route-card {
    border: 1px solid #242b38; border-radius: 10px; background: #131720;
    margin-bottom: 10px; padding: 11px 14px;
  }
  details.route-card > summary {
    cursor: pointer; list-style: none; display: flex; flex-wrap: wrap;
    align-items: center; justify-content: space-between; gap: 8px;
  }
  details.route-card > summary::-webkit-details-marker { display: none; }
  .rc-title { font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
  .rc-title::before { content: "▸"; color: #77809a; font-size: 12px; }
  details.route-card[open] .rc-title::before { content: "▾"; }
  .rc-summary { font-size: 12.5px; color: #8b93a7; }
  .rc-summary b { color: #6ee7a8; font-weight: 500; }

  .chain-preview {
    margin: 10px 0; padding: 8px 11px; border-radius: 7px;
    background: #0f131b; border: 1px solid #1e2636; font-size: 12.5px; color: #9ba5bc;
  }
  .chain-preview b { color: #e6e8ee; }

  details.src-spoiler {
    border: 1px solid #1f2633; border-radius: 8px; background: #0f1219;
    margin-bottom: 7px; padding: 7px 11px;
  }
  details.src-spoiler > summary {
    cursor: pointer; list-style: none; font-size: 13px; font-weight: 500; color: #b9c2d6;
    display: flex; justify-content: space-between; align-items: center;
  }
  details.src-spoiler > summary::-webkit-details-marker { display: none; }

  .role-controls { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .role-pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11.5px; padding: 2px 7px; border-radius: 6px;
    border: 1px solid #2a3344; background: #171c26; color: #9ba4b8; cursor: pointer;
  }
  .role-pill.active-pri { border-color: #2c6649; background: #152b21; color: #6ee7a8; font-weight: 600; }
  .role-pill.active-fb { border-color: #5c4b28; background: #262015; color: #f0b95c; font-weight: 500; }
  .ord-btn {
    padding: 1px 6px; font-size: 11px; border-radius: 5px;
    border: 1px solid #2c3546; background: #1a202c; color: #b9c0d0; cursor: pointer;
  }
  .cfm-input {
    width: 82px; padding: 4px 7px; font-size: 12px; border-radius: 6px;
    border: 1px solid #633136; background: #151922; color: #ffb4b4;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="proto-banner">
    <span><b>ТЕСТОВЫЙ СТЕНД</b> · загрузка данных</span>
    <span>Шаг 1 + Макет UI</span>
  </div>

  <h1>Esmien VPN</h1>
  <div class="meta">Загружаем данные тестового API…</div>

  <div class="notice" id="notice"></div>

  <!-- 1. УПРАВЛЕНИЕ СТОРОННИМИ ПОДПИСКАМИ -->
  <h2>Сторонние подписки</h2>
  <div class="sub-add">
    <input class="inp" id="add-name" placeholder="Название (напр. UI VPN)">
    <input class="inp" id="add-url" placeholder="URL подписки (https://...)">
    <input class="inp" id="add-tg" placeholder="Ссылка в ТГ (t.me/...)">
    <button class="btn btn-primary" id="add-btn">Добавить подписку</button>
  </div>

  <div id="subs-root"></div>

  <!-- 2. УПРАВЛЕНИЕ МАРШРУТАМИ (ОСНОВНОЙ, GEMINI, RU) -->
  <h2>Управление маршрутами (приоритеты и пул)</h2>
  <div id="routes-root"></div>
</div>

<script src="read-preview.js" defer></script>
</body>
</html>
