<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esmien VPN — статистика</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px;
    background: #0f1115; color: #e6e8ee;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
  }
  body { overflow-x: hidden; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .meta { color: #8b93a7; font-size: 13px; margin-bottom: 22px; }
  .meta b { color: #b9c0d0; font-weight: 500; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
       color: #8b93a7; font-weight: 600; margin: 26px 0 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: right; padding: 9px 10px; border-bottom: 1px solid #1d222c; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 12px; color: #77809a; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
  .srt { font-size: 9px; color: #9ba4b8; }
  th.sh { cursor: pointer; user-select: none; -webkit-user-select: none; }
  th.sh:hover { color: #cfd6e6; }
  th.sh.on { color: #cfd6e6; }
  /* граница групп: сначала те, у кого есть трафик за сутки, ниже — остальные */
  table.users tr.gap td { padding: 0; height: 12px; border-bottom: 1px solid #1b2029; }
  td { font-variant-numeric: tabular-nums; }
  svg.gem { width: 1.05em; height: 1.05em; vertical-align: -0.16em;
            margin-right: .38em; filter: drop-shadow(0 0 6px rgba(145,119,199,.35)); }
  tr:last-child td { border-bottom: none; }

  .tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  th, td { white-space: nowrap; }
  td:first-child, th:first-child { max-width: 50vw; overflow: hidden; text-overflow: ellipsis; }
  svg.fl  { width: 1.15em; height: .78em; vertical-align: -0.02em; margin-right: .5em;
            border-radius: 2px; box-shadow: 0 0 0 1px rgba(255,255,255,.14); }
  svg.gem { width: 1em; height: 1em; vertical-align: -0.14em; margin-right: .45em;
            filter: drop-shadow(0 0 6px rgba(145,119,199,.45)); }

  .meta { white-space: normal; overflow-wrap: anywhere; }
  @media (max-width: 620px) {
    table.users { table-layout: fixed; width: 100%; }
    table.users th:nth-child(2), table.users td:nth-child(2),
    table.users th:nth-child(3), table.users td:nth-child(3),
    table.users th:nth-child(4), table.users td:nth-child(4) { width: 21vw; }
    table.users th:last-child, table.users td:last-child { width: 40px; }
    table.users td { padding: 7px 2px; font-size: 12px; }
    table.users th { padding: 6px 2px; font-size: 9.5px; letter-spacing: 0; }
    table.users td:first-child { max-width: none; }
    .copy-row, .re, .del { font-size: 10px; padding: 4px 5px; }
    .rows .row { font-size: 15px; column-gap: 9px; padding: 9px 2px; }
  }

  th:not(:first-child) { text-align: right; }
  th:last-child, td:last-child { padding-right: 10px; }
  .zero { color: #5a6274; }
  .live { color: #6ee7a8; }
  .idle { color: #f0b95c; }
  .err { margin: 0 0 18px; padding: 10px 12px; border-radius: 8px;
         background: #3a1f22; color: #ffb4b4; font-size: 13px; }
  .foot { margin-top: 28px; color: #5a6274; font-size: 12px; }
  .prov { margin-top: 10px; color: #5a6274; font-size: 13px; }
  .prov b { color: #a8c0e0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .gen { display: flex; gap: 8px; margin-bottom: 12px; }
  .gen input {
    flex: 1; min-width: 0; padding: 9px 11px; border-radius: 8px;
    border: 1px solid #262d3a; background: #151922; color: #e6e8ee; font: inherit;
  }
  .gen input:focus { outline: none; border-color: #3b4a63; }
  .gen button, .copy {
    padding: 9px 14px; border-radius: 8px; border: 1px solid #2c3546;
    background: #1c2230; color: #cfd6e6; font: inherit; cursor: pointer;
  }
  .gen button:hover, .copy:hover { background: #232b3b; }
  .gen button:disabled { opacity: .5; cursor: default; }
  .link { display: flex; align-items: center; gap: 8px; padding: 8px 0;
          border-bottom: 1px solid #1d222c; font-size: 13px; }
  .link span { color: #8b93a7; width: 78px; flex: none; }
  .link a { color: #8fb7ff; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; flex: 1; }
  .copy { padding: 5px 9px; font-size: 12px; }
  .ok { color: #6ee7a8; font-size: 13px; margin: 10px 0 4px; }
  td.act { text-align: right; white-space: nowrap; }
  .del, .yes, .no {
    padding: 4px 9px; font-size: 12px; border-radius: 7px; cursor: pointer;
    border: 1px solid #2c3546; background: transparent; color: #77809a; font-family: inherit;
  }
  .del:hover { color: #ff9b9b; border-color: #4a2b2f; }
  .yes { color: #ffb4b4; border-color: #4a2b2f; background: #2a1a1d; }
  .cfm {
    width: 96px; padding: 4px 8px; font-size: 12px; border-radius: 7px;
    border: 1px solid #4a2b2f; background: #151922; color: #e6e8ee; font-family: inherit;
  }
  .err-inline { color: #ffb4b4; font-size: 12px; }
  .ok-inline { color: #6ee7a8; font-size: 12px; }
  .copy-row {
    padding: 4px 9px; margin-right: 6px; font-size: 12px; border-radius: 7px; cursor: pointer;
    border: 1px solid #2c3546; background: transparent; color: #8b93a7; font-family: inherit;
  }
  .copy-row:hover { color: #cfd6e6; border-color: #3b4a63; }
  .copy-row.done { color: #6ee7a8; border-color: #2f5741; }
  .re {
    padding: 4px 9px; font-size: 12px; border-radius: 7px; cursor: pointer;
    border: 1px solid #2c3546; background: transparent; color: #8fb7ff; font-family: inherit;
  }
  .re:hover { border-color: #33456b; background: #1a2233; }

  /* блок «Маршруты» */
  .rows { margin-top: 2px; }
  .rows .row {
    display: grid; grid-template-columns: 1.6em minmax(0, 1fr) auto;
    align-items: center; column-gap: 12px;
    padding: 11px 4px 11px 2px;
    border-bottom: 1px solid #1b2029;
    font-size: 17px; line-height: 1.35;
  }
  .rows .row:last-child { border-bottom: none; }
  .rows .row .ic { display: flex; align-items: center; }
  .rows .row .nm {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: #e6e8ee;
  }
  .rows .row .v {
    justify-self: end; color: #6fc6ff;
    font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: .01em;
  }
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    .rows .row .v {
      background: linear-gradient(180deg, #a9e3ff 0%, #62c0ff 52%, #3f9ef6 100%);
      -webkit-background-clip: text; background-clip: text;
      color: transparent; -webkit-text-fill-color: transparent;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Esmien VPN</h1>
  <div class="meta" id="meta">загрузка…</div>
  <div id="err"></div>

  <h2>Новый пользователь</h2>
  <div class="gen">
    <input id="name" placeholder="Имя (как в подписи)" maxlength="24" autocomplete="off">
    <button id="go">Создать</button>
  </div>
  <div id="genout"></div>

  <h2>Люди</h2>
  <div class="tw"><table class="users">
    <thead>
      <tr><th class="sh" data-key="name">Человек<span class="srt"></span></th><th class="sh" data-key="h24">24 ч<span class="srt"></span></th><th class="sh" data-key="d7">7 дней<span class="srt"></span></th><th class="sh" data-key="total">Всего<span class="srt"></span></th><th class="sh" data-key="last">Последнее<span class="srt"></span></th><th></th></tr>
    </thead>
    <tbody id="users"></tbody>
  </table></div>

  <h2>Маршруты</h2>
  <div class="rows" id="routes"></div>
  <div class="prov" id="prov"></div>

  <div class="foot" id="foot"></div>
</div>

<script>
const fmt = (mb) => {
  if (!mb) return "—";
  if (mb < 1) return Math.round(mb * 1024) + " KB";
  if (mb < 1024) return mb.toFixed(1) + " MB";
  return (mb / 1024).toFixed(2) + " GB";
};
const ago = (ts) => {
  if (!ts) return "не подключался";
  const s = Math.max(0, Math.floor(Date.now() / 1000) - ts);
  if (s < 90) return "только что";
  if (s < 3600) return Math.floor(s / 60) + " мин назад";
  if (s < 86400) return Math.floor(s / 3600) + " ч назад";
  return Math.floor(s / 86400) + " дн назад";
};
const dt = (ts) => ts ? new Date(ts * 1000).toLocaleString("ru-RU",
  { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";

const PROTECTED = new Set(["Владислав"]);
const actCell = (u) => {
  const copy = u.page
    ? '<button class="copy-row" title="скопировать ссылку на страницу" data-url="' + u.page + '">ссылка</button>' : "";
  if (!u.deletable) return copy;
  const main = PROTECTED.has(u.key)
    ? '<button class="re" data-name="' + u.key + '">перевыпустить</button>'
    : '<button class="del" data-name="' + u.key + '">удалить</button>';
  return copy + main;
};

// Каждый F5 сначала пересобирает снимок по требованию (свежий опрос xray + список
// пользователей), потом читает data.json — иначе после создания/удаления до 5 минут
// висела бы устаревшая таблица.
const fresh = () => fetch("api/refresh", {
  method: "POST", headers: { "Content-Type": "application/json" }, body: "{}"
}).catch(() => null);


const FLAG = (a, b, c) => '<svg class="fl" viewBox="0 0 24 16" preserveAspectRatio="none">'
  + '<rect width="24" height="5.34" fill="' + a + '"/><rect y="5.33" width="24" height="5.34" fill="' + b + '"/>'
  + '<rect y="10.66" width="24" height="5.34" fill="' + c + '"/></svg>';
const FLAGS = { EE: FLAG('#0072CE','#000000','#FFFFFF'), RU: FLAG('#FFFFFF','#0039A6','#D52B1E'),
                NL: FLAG('#AE1C28','#FFFFFF','#21468B') };
const GEM = '<svg class="gem" viewBox="0 0 24 24"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">'
  + '<stop offset="0" stop-color="#4796E3"/><stop offset=".52" stop-color="#9177C7"/>'
  + '<stop offset="1" stop-color="#D96570"/></linearGradient></defs>'
  + '<path fill="url(#gg)" d="M12 0c.7 4.6 2.4 8.1 5 9.7 1.5.9 3.6 1.4 7 1.6v1.4c-3.4.2-5.5.7-7 1.6-2.6 1.6-4.3 5.1-5 9.7h-.1c-.7-4.6-2.4-8.1-5-9.7-1.4-.9-3.5-1.4-6.9-1.6v-1.4c3.4-.2 5.5-.7 6.9-1.6C9.6 8.1 11.3 4.6 12 0z"/></svg>';
// Маршруты подписаны как «Город (чье)»: (UI VPN) — релей провайдера, (НАШ) — свой выход.
const isRu = l => /\((UI VPN|НАШ)\)/.test(l) && !l.startsWith('Gemini');
const iconFor = l => l.startsWith('Gemini') ? GEM
  : l.startsWith('Нидерланды') ? FLAGS.NL
  : isRu(l) ? FLAGS.RU
  : l.startsWith('Эстония') ? FLAGS.EE : '';

// Сортировка таблицы людей: клик по заголовку, повторный клик — разворот.
// Выбор запоминается, иначе F5 каждый раз возвращает «по суткам».
let lastData = null;
let sortState = { key: "h24", dir: -1 };
try {
  const saved = JSON.parse(localStorage.getItem("usersSort") || "null");
  if (saved && ["name", "h24", "d7", "total", "last"].includes(saved.key)
      && (saved.dir === 1 || saved.dir === -1)) sortState = saved;
} catch (e) { /* приватный режим — просто без памяти */ }

const sortMarks = () => {
  document.querySelectorAll("th.sh").forEach(th => {
    const on = th.dataset.key === sortState.key;
    th.classList.toggle("on", on);
    th.querySelector(".srt").textContent = on ? (sortState.dir < 0 ? " ▼" : " ▲") : "";
  });
};
sortMarks();

document.querySelector("table.users thead").addEventListener("click", (e) => {
  const th = e.target.closest("th.sh");
  if (!th) return;
  const key = th.dataset.key;
  sortState = { key, dir: sortState.key === key ? -sortState.dir : -1 };
  try { localStorage.setItem("usersSort", JSON.stringify(sortState)); } catch (err) {}
  sortMarks();
  if (lastData) paint(lastData);
});

const paint = (d) => {
  lastData = d;
  document.getElementById("meta").innerHTML =
    "обновлено <b>" + dt(d.updated) + "</b> · сбор с <b>" + dt(d.since) +
    "</b> · активный цвет <b>" + d.color + "</b>";

  if (d.error) document.getElementById("err").innerHTML =
    '<div class="err">последний опрос не удался: ' + d.error + "</div>";

  // Клик по заголовку сортирует таблицу; выбор запоминается в localStorage.
  const key = sortState.key, dir = sortState.dir;
  const us = d.users.slice().sort((a, b) => {
    if (key === "name") return dir * a.name.localeCompare(b.name, "ru");
    return dir * (a[key] - b[key]) || (b.total - a.total) || a.name.localeCompare(b.name, "ru");
  });
  const rows = [];
  let gap = false;
  for (const u of us) {
    if (!gap && key === "h24" && dir < 0 && !(u.h24 > 0)) {
      rows.push('<tr class="gap"><td colspan="6"></td></tr>');
      gap = true;
    }
    const cls = u.total > 0 ? (u.h24 > 0 ? "live" : "idle") : "zero";
    const mark = u.total > 0 ? (u.h24 > 0 ? "" : " *") : "";
    rows.push("<tr><td>" + u.name + "</td><td>" + fmt(u.h24) + "</td><td>" + fmt(u.d7) +
      '</td><td class="' + cls + '">' + fmt(u.total) + mark + "</td><td>" + ago(u.last) +
      '</td><td class="act">' + actCell(u) + '</td></tr>');
  }
  document.getElementById("users").innerHTML = rows.join("") ||
    '<tr><td colspan="6" class="zero">данных пока нет</td></tr>';

  // Ру-маршруты идут отдельной группой внизу, внутри группы — по убыванию трафика.
  const routeRow = r => '<div class="row"><span class="ic">' + iconFor(r.label) + '</span>'
    + '<span class="nm">' + r.label + '</span><span class="v">' + fmt(r.total) + '</span></div>';
  document.getElementById("routes").innerHTML = d.routes.slice()
    .sort((a, b) => (isRu(a.label) - isRu(b.label)) || (b.total - a.total))
    .map(routeRow).join("")
    || '<div class="row zero">данных пока нет</div>';

  // Белый список ходит на узлы провайдера напрямую — наши счётчики его не видят,
  // единственная цифра — аккаунтный расход из заголовка подписки.
  const wl = (d.provider || []).find(p => p.key === "whitelist");
  document.getElementById("prov").innerHTML = wl && wl.used
    ? "Белый список: <b>" + fmt(wl.used) + "</b>"
      + (wl.total ? " из " + fmt(wl.total) : " · без лимита") + " · счётчик провайдера"
    : "";

  const silent = d.users.filter(u => !u.total).map(u => u.name);
  document.getElementById("foot").textContent = silent.length
    ? "Без единого подключения: " + silent.join(", ")
    : "Все, кому выданы ключи, хотя бы раз подключались.";
};

const load = async () => {
  document.getElementById("meta").textContent = "обновляю…";
  try {
    await fresh();
    paint(await (await fetch("data.json", { cache: "no-store" })).json());
  } catch (e) {
    document.getElementById("meta").textContent = "не удалось загрузить data.json";
  }
};

load();
window.addEventListener("pageshow", (e) => { if (e.persisted) load(); });

const out = document.getElementById("genout");
const btn = document.getElementById("go");

const linkRow = (label, url) =>
  '<div class="link"><span>' + label + '</span><a href="' + url + '" target="_blank" rel="noreferrer">' +
  url + '</a><button class="copy" data-url="' + url + '">копировать</button></div>';

out.addEventListener("click", (e) => {
  const b = e.target.closest(".copy");
  if (!b) return;
  navigator.clipboard.writeText(b.dataset.url).then(() => {
    const old = b.textContent;
    b.textContent = "ок";
    setTimeout(() => (b.textContent = old), 1200);
  });
});

const showLinks = (name, links, note) => {
  out.innerHTML = '<div class="ok">' + note + " — " + name + "</div>" +
    linkRow("страница", links.page) + linkRow("основная", links.sub) +
    (links.lte ? linkRow("LTE", links.lte) : "");
};

const usersBody = document.getElementById("users");

usersBody.addEventListener("click", (e) => {
  const cell = e.target.closest("td.act");
  if (!cell) return;
  const del = e.target.closest(".del");
  const re = e.target.closest(".re");
  const yes = e.target.closest(".yes");
  const no = e.target.closest(".no");
  const cp = e.target.closest(".copy-row");

  if (cp) {
    navigator.clipboard.writeText(cp.dataset.url).then(() => {
      const old = cp.textContent;
      cp.textContent = "ок";
      cp.classList.add("done");
      setTimeout(() => { cp.textContent = old; cp.classList.remove("done"); }, 1200);
    });
    return;
  }

  if (del || re) {
    const who = (del || re).dataset.name;
    const mode = re ? "reissue" : "del";
    cell.dataset.name = who;
    cell.dataset.mode = mode;
    cell.innerHTML = '<input class="cfm" placeholder="' + who + '" autocomplete="off">' +
      '<button class="yes">' + (mode === "reissue" ? "перевыпустить" : "удалить") + "</button>" +
      '<button class="no">×</button>';
    cell.querySelector("input").focus();
    return;
  }
  if (no) {
    const back = cell.dataset.mode === "reissue"
      ? '<button class="re" data-name="' + cell.dataset.name + '">перевыпустить</button>'
      : '<button class="del" data-name="' + cell.dataset.name + '">удалить</button>';
    cell.innerHTML = back;
    return;
  }
  if (!yes) return;

  const who = cell.dataset.name;
  const mode = cell.dataset.mode === "reissue" ? "reissue" : "del";
  const typed = cell.querySelector("input").value.trim();
  if (typed !== who) {
    const inp = cell.querySelector("input");
    inp.value = "";
    inp.placeholder = "введи: " + who;
    return;
  }
  cell.innerHTML = '<span class="meta">' + (mode === "reissue" ? "перевыпускаю…" : "удаляю…") + "</span>";
  fetch("api/" + mode, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: who })
  }).then(r => r.json()).then(d => {
    if (d.ok && mode === "reissue") {
      showLinks(d.name, d.links, d.hint || "перевыпущено");
      cell.innerHTML = '<span class="ok-inline">готово</span>';
      load();
    } else if (d.ok) {
      location.reload();
    } else {
      cell.innerHTML = '<span class="err-inline">' + (d.error || "ошибка") + "</span>";
    }
  }).catch(() => {
    cell.innerHTML = '<span class="err-inline">сеть недоступна</span>';
  });
});

btn.addEventListener("click", async () => {
  const name = document.getElementById("name").value.trim();
  if (!name) return;
  btn.disabled = true;
  out.innerHTML = '<div class="meta">создаю ключ и применяю конфиг, это ~40–60 с…</div>';
  try {
    const r = await fetch("api/new", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name })
    });
    const d = await r.json();
    if (d.ok) {
      showLinks(d.name, d.links, d.hint || "готово");
      document.getElementById("name").value = "";
      load();
    } else if (d.exists) {
      showLinks(d.name, d.links, "такой уже есть, вот его ссылки");
    } else {
      out.innerHTML = '<div class="err">' + (d.error || "ошибка") + "</div>";
    }
  } catch (e) {
    out.innerHTML = '<div class="err">сеть: ' + e + "</div>";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
