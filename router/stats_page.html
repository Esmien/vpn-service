<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esmien VPN — статистика</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px;
    background: #0f1115; color: #e6e8ee;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .meta { color: #8b93a7; font-size: 13px; margin-bottom: 22px; }
  .meta b { color: #b9c0d0; font-weight: 500; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
       color: #8b93a7; font-weight: 600; margin: 26px 0 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: right; padding: 9px 10px; border-bottom: 1px solid #1d222c; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 12px; color: #77809a; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
  td { font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  .zero { color: #5a6274; }
  .live { color: #6ee7a8; }
  .idle { color: #f0b95c; }
  .err { margin: 0 0 18px; padding: 10px 12px; border-radius: 8px;
         background: #3a1f22; color: #ffb4b4; font-size: 13px; }
  .foot { margin-top: 28px; color: #5a6274; font-size: 12px; }
  .gen { display: flex; gap: 8px; margin-bottom: 12px; }
  .gen input {
    flex: 1; min-width: 0; padding: 9px 11px; border-radius: 8px;
    border: 1px solid #262d3a; background: #151922; color: #e6e8ee; font: inherit;
  }
  .gen input:focus { outline: none; border-color: #3b4a63; }
  .gen button, .copy {
    padding: 9px 14px; border-radius: 8px; border: 1px solid #2c3546;
    background: #1c2230; color: #cfd6e6; font: inherit; cursor: pointer;
  }
  .gen button:hover, .copy:hover { background: #232b3b; }
  .gen button:disabled { opacity: .5; cursor: default; }
  .link { display: flex; align-items: center; gap: 8px; padding: 8px 0;
          border-bottom: 1px solid #1d222c; font-size: 13px; }
  .link span { color: #8b93a7; width: 78px; flex: none; }
  .link a { color: #8fb7ff; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; flex: 1; }
  .copy { padding: 5px 9px; font-size: 12px; }
  .ok { color: #6ee7a8; font-size: 13px; margin: 10px 0 4px; }
  td.act { text-align: right; white-space: nowrap; }
  .del, .yes, .no {
    padding: 4px 9px; font-size: 12px; border-radius: 7px; cursor: pointer;
    border: 1px solid #2c3546; background: transparent; color: #77809a; font-family: inherit;
  }
  .del:hover { color: #ff9b9b; border-color: #4a2b2f; }
  .yes { color: #ffb4b4; border-color: #4a2b2f; background: #2a1a1d; }
  .cfm {
    width: 96px; padding: 4px 8px; font-size: 12px; border-radius: 7px;
    border: 1px solid #4a2b2f; background: #151922; color: #e6e8ee; font-family: inherit;
  }
  .err-inline { color: #ffb4b4; font-size: 12px; }
  .ok-inline { color: #6ee7a8; font-size: 12px; }
  .copy-row {
    padding: 4px 9px; margin-right: 6px; font-size: 12px; border-radius: 7px; cursor: pointer;
    border: 1px solid #2c3546; background: transparent; color: #8b93a7; font-family: inherit;
  }
  .copy-row:hover { color: #cfd6e6; border-color: #3b4a63; }
  .copy-row.done { color: #6ee7a8; border-color: #2f5741; }
  .re {
    padding: 4px 9px; font-size: 12px; border-radius: 7px; cursor: pointer;
    border: 1px solid #2c3546; background: transparent; color: #8fb7ff; font-family: inherit;
  }
  .re:hover { border-color: #33456b; background: #1a2233; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Esmien VPN</h1>
  <div class="meta" id="meta">загрузка…</div>
  <div id="err"></div>

  <h2>Новый пользователь</h2>
  <div class="gen">
    <input id="name" placeholder="Имя (как в подписи)" maxlength="24" autocomplete="off">
    <button id="go">Создать</button>
  </div>
  <div id="genout"></div>

  <h2>Люди</h2>
  <table>
    <thead>
      <tr><th>Человек</th><th>24 ч</th><th>7 дней</th><th>Всего</th><th>Последнее</th><th></th></tr>
    </thead>
    <tbody id="users"></tbody>
  </table>

  <h2>Маршруты</h2>
  <table>
    <thead><tr><th>Маршрут</th><th>Всего</th></tr></thead>
    <tbody id="routes"></tbody>
  </table>

  <div class="foot" id="foot"></div>
</div>

<script>
const fmt = (mb) => {
  if (!mb) return "—";
  if (mb < 1) return Math.round(mb * 1024) + " KB";
  if (mb < 1024) return mb.toFixed(1) + " MB";
  return (mb / 1024).toFixed(2) + " GB";
};
const ago = (ts) => {
  if (!ts) return "не подключался";
  const s = Math.max(0, Math.floor(Date.now() / 1000) - ts);
  if (s < 90) return "только что";
  if (s < 3600) return Math.floor(s / 60) + " мин назад";
  if (s < 86400) return Math.floor(s / 3600) + " ч назад";
  return Math.floor(s / 86400) + " дн назад";
};
const dt = (ts) => ts ? new Date(ts * 1000).toLocaleString("ru-RU",
  { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";

const PROTECTED = new Set(["Владислав"]);
const actCell = (u) => {
  const copy = u.page
    ? '<button class="copy-row" title="скопировать ссылку на страницу" data-url="' + u.page + '">ссылка</button>' : "";
  if (!u.deletable) return copy;
  const main = PROTECTED.has(u.key)
    ? '<button class="re" data-name="' + u.key + '">перевыпустить</button>'
    : '<button class="del" data-name="' + u.key + '">удалить</button>';
  return copy + main;
};

fetch("data.json", { cache: "no-store" }).then(r => r.json()).then(d => {
  document.getElementById("meta").innerHTML =
    "обновлено <b>" + dt(d.updated) + "</b> · сбор с <b>" + dt(d.since) +
    "</b> · активный цвет <b>" + d.color + "</b>";

  if (d.error) document.getElementById("err").innerHTML =
    '<div class="err">последний опрос не удался: ' + d.error + "</div>";

  const rows = d.users.map(u => {
    const cls = u.total > 0 ? (u.h24 > 0 ? "live" : "idle") : "zero";
    const mark = u.total > 0 ? (u.h24 > 0 ? "" : " ·") : "";
    return "<tr><td>" + u.name + "</td><td>" + fmt(u.h24) + "</td><td>" + fmt(u.d7) +
      '</td><td class="' + cls + '">' + fmt(u.total) + mark + "</td><td>" + ago(u.last) +
      '</td><td class="act">' + actCell(u) + '</td></tr>';
  });
  document.getElementById("users").innerHTML = rows.join("") ||
    '<tr><td colspan="6" class="zero">данных пока нет</td></tr>';

  document.getElementById("routes").innerHTML = d.routes.map(r =>
    "<tr><td>" + r.label + "</td><td>" + fmt(r.total) + "</td></tr>").join("") ||
    '<tr><td colspan="2" class="zero">данных пока нет</td></tr>';

  const silent = d.users.filter(u => !u.total).map(u => u.name);
  document.getElementById("foot").textContent = silent.length
    ? "Без единого подключения: " + silent.join(", ")
    : "Все, кому выданы ключи, хотя бы раз подключались.";
}).catch(() => {
  document.getElementById("meta").textContent = "не удалось загрузить data.json";
});

const out = document.getElementById("genout");
const btn = document.getElementById("go");

const linkRow = (label, url) =>
  '<div class="link"><span>' + label + '</span><a href="' + url + '" target="_blank" rel="noreferrer">' +
  url + '</a><button class="copy" data-url="' + url + '">копировать</button></div>';

out.addEventListener("click", (e) => {
  const b = e.target.closest(".copy");
  if (!b) return;
  navigator.clipboard.writeText(b.dataset.url).then(() => {
    const old = b.textContent;
    b.textContent = "ок";
    setTimeout(() => (b.textContent = old), 1200);
  });
});

const showLinks = (name, links, note) => {
  out.innerHTML = '<div class="ok">' + note + " — " + name + "</div>" +
    linkRow("страница", links.page) + linkRow("основная", links.sub) +
    (links.lte ? linkRow("LTE", links.lte) : "");
};

const usersBody = document.getElementById("users");

usersBody.addEventListener("click", (e) => {
  const cell = e.target.closest("td.act");
  if (!cell) return;
  const del = e.target.closest(".del");
  const re = e.target.closest(".re");
  const yes = e.target.closest(".yes");
  const no = e.target.closest(".no");
  const cp = e.target.closest(".copy-row");

  if (cp) {
    navigator.clipboard.writeText(cp.dataset.url).then(() => {
      const old = cp.textContent;
      cp.textContent = "ок";
      cp.classList.add("done");
      setTimeout(() => { cp.textContent = old; cp.classList.remove("done"); }, 1200);
    });
    return;
  }

  if (del || re) {
    const who = (del || re).dataset.name;
    const mode = re ? "reissue" : "del";
    cell.dataset.name = who;
    cell.dataset.mode = mode;
    cell.innerHTML = '<input class="cfm" placeholder="' + who + '" autocomplete="off">' +
      '<button class="yes">' + (mode === "reissue" ? "перевыпустить" : "удалить") + "</button>" +
      '<button class="no">×</button>';
    cell.querySelector("input").focus();
    return;
  }
  if (no) {
    const back = cell.dataset.mode === "reissue"
      ? '<button class="re" data-name="' + cell.dataset.name + '">перевыпустить</button>'
      : '<button class="del" data-name="' + cell.dataset.name + '">удалить</button>';
    cell.innerHTML = back;
    return;
  }
  if (!yes) return;

  const who = cell.dataset.name;
  const mode = cell.dataset.mode === "reissue" ? "reissue" : "del";
  const typed = cell.querySelector("input").value.trim();
  if (typed !== who) {
    const inp = cell.querySelector("input");
    inp.value = "";
    inp.placeholder = "введи: " + who;
    return;
  }
  cell.innerHTML = '<span class="meta">' + (mode === "reissue" ? "перевыпускаю…" : "удаляю…") + "</span>";
  fetch("api/" + mode, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: who })
  }).then(r => r.json()).then(d => {
    if (d.ok && mode === "reissue") {
      showLinks(d.name, d.links, d.hint || "перевыпущено");
      cell.innerHTML = '<span class="ok-inline">готово</span>';
    } else if (d.ok) {
      location.reload();
    } else {
      cell.innerHTML = '<span class="err-inline">' + (d.error || "ошибка") + "</span>";
    }
  }).catch(() => {
    cell.innerHTML = '<span class="err-inline">сеть недоступна</span>';
  });
});

btn.addEventListener("click", async () => {
  const name = document.getElementById("name").value.trim();
  if (!name) return;
  btn.disabled = true;
  out.innerHTML = '<div class="meta">создаю ключ и применяю конфиг, это ~40–60 с…</div>';
  try {
    const r = await fetch("api/new", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name })
    });
    const d = await r.json();
    if (d.ok) {
      showLinks(d.name, d.links, d.hint || "готово");
      document.getElementById("name").value = "";
    } else if (d.exists) {
      showLinks(d.name, d.links, "такой уже есть, вот его ссылки");
    } else {
      out.innerHTML = '<div class="err">' + (d.error || "ошибка") + "</div>";
    }
  } catch (e) {
    out.innerHTML = '<div class="err">сеть: ' + e + "</div>";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
